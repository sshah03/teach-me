# Runs /teach-me for real with Claude, on one machine type. It only runs when started by hand from the
# Actions tab, and needs an ANTHROPIC_API_KEY secret. It uses Haiku and a spending cap to keep the cost low.
name: End to end

on:
  workflow_dispatch:
    inputs:
      os:
        description: Machine type
        type: choice
        options: [windows-latest, ubuntu-latest, macos-latest]
        default: windows-latest
      pr:
        description: Pull request to also try (leave blank to skip)
        default: sindresorhus/p-queue#244

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PLUGIN: ${{ github.workspace }}
      CLAUDE: claude --plugin-dir ${{ github.workspace }} --model claude-haiku-5-5 --dangerously-skip-permissions --max-budget-usd 1.50 --output-format stream-json --verbose -p
    steps:
      - name: Check for the API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "Add an ANTHROPIC_API_KEY secret first."; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code

      - name: Explain an idea
        run: |
          mkdir -p "$RUNNER_TEMP/concept" && cd "$RUNNER_TEMP/concept"
          $CLAUDE '/teach-me:teach-me how a ring buffer overwrites its oldest item' > run.jsonl || true
          python "$PLUGIN/tests/e2e_check.py" . run.jsonl

      - name: Explain a pull request
        if: inputs.pr != ''
        env:
          PR: ${{ inputs.pr }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr" && cd "$RUNNER_TEMP/pr"
          $CLAUDE "/teach-me:teach-me $PR" > run.jsonl || true
          python "$PLUGIN/tests/e2e_check.py" . run.jsonl --pr

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-${{ inputs.os }}
          path: |
            ${{ runner.temp }}/concept
            ${{ runner.temp }}/pr
